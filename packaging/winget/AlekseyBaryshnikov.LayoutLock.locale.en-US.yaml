ShortDescription: Restores window positions after hibernate when you move between two equivalent multi-monitor setups.
Description: |-
  LayoutLock is a small tray app for laptops that dock to different monitors at different places (e.g. office and home).
  It saves every window's position when Windows hibernates or sleeps and puts the windows back on the matching monitor
  after resume. Monitors are matched by their left-to-right order, so equivalent displays at both locations map onto
  each other even though Windows sees them as different hardware. Maximized, minimized and snapped windows are restored,
  and every restore shows a notification.
